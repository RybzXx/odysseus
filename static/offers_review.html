<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue review — Bil Weekend offers</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6862;
    --line: #e2e0da; --accent: #2f5d50; --warn: #8a5a1c; --gone: #8a2f2f;
    --add: #eaf3ee; --del: #fbeeee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1e2024; --ink: #e8e6e1; --muted: #9a978f;
      --line: #313439; --accent: #7fb8a4; --warn: #d3a15f; --gone: #d98b8b;
      --add: #1d2b24; --del: #2e2020;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel);
           border-bottom: 1px solid var(--line); padding: 14px 20px; }
  h1 { margin: 0 0 4px; font-size: 17px; font-weight: 620; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel);
           color: var(--ink); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--gone); }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px;
         border: 1px solid var(--line); color: var(--muted); }
  .tag.new { color: var(--accent); border-color: var(--accent); }
  .tag.revision { color: var(--warn); border-color: var(--warn); }
  .tag.stale { color: var(--gone); border-color: var(--gone); }
  .tag.rare { color: var(--accent); border-color: var(--accent); }
  .grow { flex: 1; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .col h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase;
            letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  pre, textarea { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
                  white-space: pre-wrap; word-break: break-word; margin: 0;
                  background: var(--bg); border: 1px solid var(--line);
                  border-radius: 7px; padding: 10px; color: var(--ink); }
  pre.current { background: var(--del); }
  textarea { width: 100%; min-height: 190px; background: var(--add); resize: vertical; }
  input[type=text], select { font: inherit; padding: 6px 9px; border: 1px solid var(--line);
                     border-radius: 7px; background: var(--bg); color: var(--ink); }
  .fields { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .fields label { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .note { color: var(--muted); font-size: 13px; }
  .evidence { margin-top: 10px; }
  .evidence summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .evidence pre { margin-top: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  .err { color: var(--gone); }
  .warn { color: var(--gone); border-left: 3px solid var(--gone); padding-left: 8px;
          margin-top: 6px; font-size: 13px; }
  .mirror { margin-top: 8px; padding: 8px 10px; border-radius: 7px;
            background: var(--del); color: var(--gone); font-size: 13px; }
  .diff ins { background: var(--add); text-decoration: none; padding: 0 2px; }
  .diff del { background: var(--del); padding: 0 2px; }
  .grouping { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .grouping input { width: 120px; }
  .search { width: 220px; }
  .sep { color: var(--line); padding: 0 2px; }
  .group { border: 1px solid var(--warn); border-radius: 10px; padding: 8px; margin-top: 14px; }
  .group-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
                padding: 4px 6px 10px; }
  .group .card { margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Catalogue review</h1>
  <div class="sub" id="summary">loading…</div>
  <div class="bar">
    <button id="f-pending" class="primary">Pending</button>
    <button id="f-approved">Approved</button>
    <button id="f-rejected">Rejected</button>
    <button id="f-retired">Retired</button>
    <span class="sep">|</span>
    <button id="q-rare" class="primary">Rare</button>
    <button id="q-recurring">Recurring</button>
    <button id="q-all">All</button>
    <input type="text" id="search" class="search" placeholder="search the proposals…">
    <span class="grow"></span>
    <label class="grouping">Group near-duplicates
      <input type="range" id="grouping" min="50" max="95" step="5" value="70">
      <span id="grouping-value">0.70</span></label>
    <button id="rebuild">Re-derive from corpus</button>
    <button id="apply">Apply approved to the catalogue</button>
  </div>
  <div class="sub" id="apply-plan"></div>
  <div class="sub" id="gap"></div>
  <div class="sub" id="grouping-count"></div>
</header>
<main id="list"><div class="empty">loading…</div></main>

<div id="more" class="bar"></div>

<script src="/static/js/offersReview.js?v=20260905search1"></script>
</body>
</html>
