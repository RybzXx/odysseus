<!DOCTYPE html>
<!-- `desk-standalone` scopes the tokens in deskShared.css to this page. The app
     loads the same file and must keep its own palette, because `theme.js` owns
     it (ws-03 item 24.1). -->
<html lang="en" class="desk-standalone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerary desk — Bil Weekend</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/css/deskShared.css?v=20260908b">
<style>
  /* ── the page ──────────────────────────────────────────────────────────
     A queue on the left and one detail pane on the right (ws-03 D49). The
     layout is unchanged. Only the type and the colour move.

     WHO DID THE WORK IS THE COLOUR AXIS

     Three actors touch a request, and a reader has to tell them apart at a
     glance: a model, the deterministic rules, and a person. So colour carries
     provenance and nothing else.

     Severity is not a fourth colour. A fault is red because red reads as a
     fault everywhere, and a flag is an outline rather than a hue, so the three
     actor colours never compete with a warning.
  */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 400 14px/1.55 "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: Bitter, Georgia, "Times New Roman", serif; margin: 0;
           text-wrap: balance; }
  .mono, code { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 11px 18px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .note { color: var(--fg-muted); font-size: 12px; }
  .err { color: var(--status-error); }
  .grow { flex: 1; }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 500;
    letter-spacing: .12em; text-transform: uppercase; color: var(--fg-muted);
  }

  button {
    font: inherit; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--fg);
    border-radius: 7px; padding: 5px 11px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: var(--panel); font-weight: 600; }
  button[disabled] { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  input[type=text], textarea, select {
    font: inherit; font-size: 12px; width: 100%; padding: 6px 9px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--fg);
  }
  textarea { min-height: 70px; resize: vertical; font-family: inherit; }

  /* ── the filter bar (ws-03 D51) ────────────────────────────────────── */
  .filters { display: flex; flex-direction: column; gap: 6px;
             padding: 9px 18px; border-bottom: 1px solid var(--border);
             background: var(--panel); }
  .filters-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; }
  .chip, .dd-toggle {
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    padding: 3px 10px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg-elev);
    color: var(--fg-muted); cursor: pointer;
  }
  .chip.active, .dd-toggle.active {
    background: var(--accent); color: var(--panel);
    border-color: var(--accent); font-weight: 500;
  }
  .dropdown { position: relative; }
  .dd-caret { font-size: 9px; opacity: .8; }
  .dd-panel { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
              min-width: 208px; max-height: 280px; overflow-y: auto;
              background: var(--bg-elev); border: 1px solid var(--border);
              border-radius: 9px; padding: 6px;
              box-shadow: 0 8px 22px rgba(0,0,0,.32); }
  .dd-option { display: flex; align-items: center; gap: 7px; font-size: 12px;
               color: var(--fg); padding: 4px 6px; border-radius: 5px;
               cursor: pointer; white-space: nowrap; }
  .dd-option:hover { background: var(--bg); }
  .dd-count { margin-left: auto; opacity: .6; font-variant-numeric: tabular-nums; }
  .search { max-width: 330px; }

  /* ── the two panes ─────────────────────────────────────────────────── */
  main { display: grid; grid-template-columns: 320px 1fr;
         height: calc(100vh - 98px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }

  #queue { border-right: 1px solid var(--border); overflow-y: auto;
           background: var(--panel); }
  .qrow { display: block; width: 100%; text-align: left; border: none;
          border-bottom: 1px solid var(--border); border-radius: 0;
          background: transparent; padding: 10px 14px; cursor: pointer; }
  .qrow:hover { background: var(--bg-elev); border-color: var(--border); }
  .qrow[aria-current="true"] { background: var(--bg-elev);
    box-shadow: inset 3px 0 0 var(--accent); }
  .qrow .who { font-weight: 600; font-size: 13px; }
  .qrow .meta { color: var(--fg-muted); font-size: 11px; margin-top: 2px;
                font-family: "IBM Plex Mono", monospace; }
  .qrow .marks { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
  .qcount { padding: 9px 14px; border-bottom: 1px solid var(--border);
            font-family: "IBM Plex Mono", monospace; font-size: 11px;
            letter-spacing: .04em; color: var(--fg-muted);
            font-variant-numeric: tabular-nums; }

  .badge {
    font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 500;
    padding: 1.5px 6px; border-radius: 3px; letter-spacing: .06em;
    text-transform: uppercase; border: 1px solid currentColor;
    color: var(--fg-muted); white-space: nowrap;
  }
  .badge.draft { color: var(--by-rules); }
  .badge.doc { color: var(--status-ok); }
  .badge.fault { color: var(--status-error); }
  .badge.flag { color: var(--fg-muted); border-style: dashed; }
  .badge.spam { color: var(--status-error); }
  .badge.orphan { color: var(--status-warn); }

  #detail { overflow-y: auto; padding: 0 0 44px; }
  .empty { color: var(--fg-muted); padding: 44px 20px; text-align: center; }

  /* ── who did the work ──────────────────────────────────────────────── */
  .by {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 500;
    letter-spacing: .07em; text-transform: uppercase;
    padding: 1.5px 7px; border-radius: 3px; border: 1px solid currentColor;
    white-space: nowrap;
  }
  .by.model { color: var(--by-model); }
  .by.rules { color: var(--by-rules); }
  .by.human { color: var(--by-human); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
            padding: 9px 18px 0; }
  .legend .lg { display: flex; gap: 6px; align-items: center;
                font-size: 11.5px; color: var(--fg-muted); }

  /* ── the fixed strip: input, run, output (ws-03 D52) ───────────────── */
  .who-line { padding: 14px 18px 0; }
  .who-line h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .who-line .note { font-family: "IBM Plex Mono", monospace; margin-top: 2px; }
  .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
           margin: 12px 18px 16px; }
  @media (max-width: 1100px) { .strip { grid-template-columns: 1fr; } }
  .strip > div { background: var(--panel); border: 1px solid var(--border);
                 border-radius: 10px; padding: 12px 14px; }
  .strip h3 { font-family: "IBM Plex Mono", monospace; font-size: 10px;
              text-transform: uppercase; letter-spacing: .12em;
              color: var(--fg-muted); margin: 0 0 7px; font-weight: 500; }
  .strip .big { font-family: Bitter, Georgia, serif; font-size: 19px;
                font-weight: 700; letter-spacing: -.01em;
                font-variant-numeric: tabular-nums; }
  .strip .sub { font-size: 12px; color: var(--fg-dim); margin-top: 2px; }
  .strip .bar { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap;
                align-items: center; }
  /* The output card is where a press leaves this machine. */
  .strip > div.output { border-color: var(--accent); }

  /* ── the collapsible sections (ws-03 D53) ──────────────────────────── */
  details.sec { margin: 0 18px 10px; background: var(--panel);
                border: 1px solid var(--border); border-radius: 10px; }
  details.sec > summary {
    cursor: pointer; padding: 11px 13px; list-style: none;
    display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap;
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 500;
    letter-spacing: .1em; text-transform: uppercase; color: var(--fg-muted);
  }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: "▸"; font-size: 9px; }
  details.sec[open] > summary::before { content: "▾"; }
  details.sec > summary .headline {
    font-family: "IBM Plex Sans", sans-serif; font-size: 12.5px;
    text-transform: none; letter-spacing: 0; font-weight: 400;
    color: var(--fg-dim);
  }
  details.sec > summary.warn { color: var(--status-warn); }
  details.sec > summary.bad { color: var(--status-error); }
  details.sec > .body { padding: 0 13px 13px; }
  /* A stripe on the left says who owns the section's content. */
  details.sec.by-model  { border-left: 3px solid var(--by-model); }
  details.sec.by-rules  { border-left: 3px solid var(--by-rules); }
  details.sec.by-human  { border-left: 3px solid var(--by-human); }

  /* ── the seven steps (ws-03 D56) ───────────────────────────────────── */
  .step { display: grid; grid-template-columns: 20px 1fr 66px 178px 26px;
          gap: 9px; align-items: baseline; padding: 6px 0 6px 9px;
          border-top: 1px solid var(--border); font-size: 12.5px;
          border-left: 3px solid transparent; }
  .step:first-child { border-top: none; }
  .step.model { border-left-color: var(--by-model); }
  .step.rules { border-left-color: var(--by-rules); }
  .step .n { color: var(--fg-muted); font-family: "IBM Plex Mono", monospace;
             font-variant-numeric: tabular-nums; }
  .step .name { font-weight: 600; font-family: "IBM Plex Mono", monospace;
                font-size: 12px; }
  .step .ms { color: var(--fg-muted); text-align: right;
              font-family: "IBM Plex Mono", monospace;
              font-variant-numeric: tabular-nums; }
  .step .where { color: var(--fg-muted); font-size: 11px;
                 font-family: "IBM Plex Mono", monospace;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step.untested .name { color: var(--status-warn); }
  .step.failed .name { color: var(--status-error); }
  .step .said { grid-column: 2 / -1; color: var(--fg-dim); font-size: 11.5px; }
  .step-open { background: none; border: none; color: var(--accent);
               cursor: pointer; padding: 0; font-size: 13px; }
  pre.drawer { white-space: pre-wrap; word-break: break-word;
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 11px; margin: 6px 0 10px; max-height: 420px; overflow: auto; }

  /* ── shared small parts ────────────────────────────────────────────── */
  .card { background: var(--bg); border: 1px solid var(--border);
          border-radius: 9px; padding: 11px 13px; margin-bottom: 9px; }
  .card.model { border-left: 3px solid var(--by-model); }
  .card.rules { border-left: 3px solid var(--by-rules); }
  .fault { display: flex; gap: 9px; margin: 5px 0; font-size: 12.5px; }
  .fault .kind { color: var(--status-error); min-width: 116px; font-size: 10.5px;
                 font-family: "IBM Plex Mono", monospace; letter-spacing: .05em;
                 text-transform: uppercase; }
  .fault.flag .kind { color: var(--fg-muted); }
  .warn { color: var(--status-warn); font-size: 12px; margin-top: 4px; }
  .code { display: inline-block; font-family: "IBM Plex Mono", monospace;
          font-size: 11px; padding: 1.5px 6px; margin: 1.5px;
          border: 1px solid var(--border); border-radius: 4px; }
  .code.faulty { border-color: var(--status-error); color: var(--status-error); }
  .turn { border-top: 1px solid var(--border); padding: 8px 0; font-size: 12.5px; }
  .turn:first-child { border-top: none; }
  .row { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: 152px 1fr; gap: 3px 12px;
        font-size: 12.5px; }
  .kv > .k { color: var(--fg-muted); font-family: "IBM Plex Mono", monospace;
             font-size: 11.5px; }

  /* The worklist controls the desk was missing. A person's own presses, so
     they carry the human actor like every other thing you type. */
  .wl-grid { display: grid; grid-template-columns: 108px 1fr; gap: 8px 12px;
             align-items: center; }
  .wl-grid > .k { color: var(--fg-muted); font-family: "IBM Plex Mono", monospace;
                  font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
  .wl-grid input[type=text] { max-width: 260px; }
  @media (max-width: 620px) { .wl-grid { grid-template-columns: 1fr; gap: 3px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important;
                                                transition: none !important; } }
</style>
</head>
<body>

<header>
  <h1>Itinerary desk</h1>
  <span class="note" id="summary">loading…</span>
  <span class="grow"></span>
  <span class="note" id="codes-note"></span>
  <button id="new-request">Type a request by hand</button>
</header>

<div class="filters" id="filters"><span class="note">loading requests…</span></div>

<main>
  <section id="queue"><div class="empty">loading…</div></section>
  <section id="detail"><div class="empty">Choose a request.</div></section>
</main>

<script src="/static/js/briefCard.js?v=20260908b"></script>
<script src="/static/js/deskWorklistActions.js?v=20260908"></script>
<script src="/static/js/itineraryDesk.js?v=20260908wl1"></script>
</body>
</html>
