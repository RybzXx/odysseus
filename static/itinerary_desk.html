<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerary desk — Bil Weekend</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6862;
    --line: #e2e0da; --accent: #2f5d50; --warn: #8a5a1c; --gone: #8a2f2f;
    --add: #eaf3ee; --del: #fbeeee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1e2024; --ink: #e8e6e1; --muted: #9a978f;
      --line: #313439; --accent: #7fb8a4; --warn: #d3a15f; --gone: #d98b8b;
      --add: #1d2b24; --del: #2e2020;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel);
           border-bottom: 1px solid var(--line); padding: 14px 20px; }
  h1 { margin: 0 0 4px; font-size: 17px; font-weight: 620; letter-spacing: -0.01em; }
  h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase;
       letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 16px;
         max-width: 1400px; margin: 0 auto; padding: 20px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel);
           color: var(--ink); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .grow { flex: 1; }
  .note { color: var(--muted); font-size: 13px; }
  .err { color: var(--gone); }
  .warn { color: var(--gone); border-left: 3px solid var(--gone); padding-left: 8px;
          margin-top: 6px; font-size: 13px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px;
         border: 1px solid var(--line); color: var(--muted); }
  .tag.model { color: var(--warn); border-color: var(--warn); }
  .tag.rules { color: var(--accent); border-color: var(--accent); }
  textarea, input[type=text] { font: inherit; width: 100%; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--ink); }
  textarea { min-height: 150px; resize: vertical;
             font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .field { margin-bottom: 8px; }
  .field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  .seq { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
          border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .code.same { border-color: var(--accent); background: var(--add); }
  .code.differ { border-color: var(--gone); background: var(--del); }
  .code.only { border-style: dashed; }
  .code.faulty { border-color: var(--warn); border-width: 2px; }
  details.check { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
  details.check > summary { cursor: pointer; font-size: 12px; text-transform: uppercase;
    color: var(--warn);
    letter-spacing: .04em; }
  details.check > summary.ok { color: var(--accent); }
  .fault { display: flex; gap: 8px; align-items: baseline; margin: 6px 0;
    border-left: 2px solid var(--warn); padding-left: 10px; font-size: 13px; }
  .fault .kind { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--warn); flex: 0 0 auto; }
  .flag { display: flex; gap: 8px; align-items: baseline; margin: 6px 0;
    border-left: 2px dashed var(--muted); padding-left: 10px; font-size: 13px;
    color: var(--muted); }
  .flag .kind { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    flex: 0 0 auto; }
  .note.ok { color: var(--accent); }
  .warn.inline { border: none; padding-left: 0; margin-top: 0; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .thread { border-left: 2px solid var(--line); padding-left: 12px; margin-top: 10px; }
  .turn { margin-bottom: 10px; }

  /* The request strip. Ten at a time, because the offers review page locked a
     phone browser when it wrote 257 cards in one go. */
  nav.strip { background: var(--panel); border-bottom: 1px solid var(--line);
              padding: 10px 20px; position: sticky; top: 92px; z-index: 4; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
          font: 13px/1.3 inherit; border: 1px solid var(--line); background: var(--bg);
          color: var(--ink); border-radius: 999px; padding: 5px 12px; }
  .pill:hover { border-color: var(--accent); }
  .pill[aria-current="true"] { background: var(--accent); border-color: var(--accent);
                               color: #fff; }
  .pill .who { font-weight: 600; }
  .pill .st { font-size: 11px; opacity: .75; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill .dot.curated { background: var(--accent); }
  .pill .dot.queue { background: var(--warn); }
  .pill .has-doc { font-size: 11px; color: var(--accent); }
  .pill[aria-current="true"] .has-doc { color: #fff; }
  .strip-bar { display: flex; gap: 8px; align-items: center;
               margin-top: 8px; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 2px 10px;
        font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .kv dd.differs { color: var(--warn); font-weight: 600; }

  /* The two rule books. Kept visibly apart: a counted rule carries a
     denominator, a judged one carries the comment that produced it. */
  details.book { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  details.book > summary { cursor: pointer; font-size: 12px; text-transform: uppercase;
                           letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .rule { border-left: 2px solid var(--line); padding-left: 10px; margin: 8px 0; }
  .rule .stat { font-size: 13px; }
  .rule .n { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
             color: var(--muted); }
  .rule.agrees { border-left-color: var(--accent); }
  .rule.disagrees { border-left-color: var(--warn); }
  .rule.silent { border-left-style: dashed; }
</style>
</head>
<body>
<header>
  <h1>Itinerary desk</h1>
  <div class="sub" id="summary">loading…</div>
  <div class="bar">
    <button id="new-request" class="primary">New request</button>
    <select id="draft-list"></select>
    <span class="grow"></span>
    <span class="note" id="codes-note"></span>
  </div>
</header>

<nav class="strip">
  <div class="pills" id="pills"><span class="note">loading requests…</span></div>
  <div class="strip-bar">
    <button id="pill-more">Show ten more</button>
    <span class="note" id="pill-count"></span>
    <span class="grow"></span>
    <span class="note" id="pill-error"></span>
  </div>
</nav>

<main>
  <section id="request-pane">
    <div class="card" id="request-card"><div class="empty">no request open</div></div>
  </section>
  <section id="answer-pane">
    <div class="card"><div class="empty">open a request to see a sequence</div></div>
  </section>
</main>

<section style="max-width:1400px;margin:0 auto;padding:0 20px 30px">
  <div class="card" id="rule-books"><div class="note">loading the rule books…</div></div>
</section>

<script src="/static/js/itineraryDesk.js?v=20260907flags1"></script>
</body>
</html>
