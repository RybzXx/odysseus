<!DOCTYPE html>
<!-- `desk-standalone` scopes the light answer in deskShared.css to this
     page. The app loads the same file and must not follow a reader's
     system setting, because `theme.js` owns its palette. -->
<html lang="en" class="desk-standalone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerary desk — Bil Weekend</title>
<!-- The tokens and the brief card, shared with the Operations modal.
     `style.css` is 41,421 lines, so the desk takes the small part it needs
     rather than the whole app's styling (ws-03 D54, item 24.1). -->
<link rel="stylesheet" href="/static/css/deskShared.css?v=20260908">
<style>
  /* ── the page ──────────────────────────────────────────────────────────
     A queue on the left and one detail pane on the right (ws-03 D49). */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
               Roboto, Arial, sans-serif; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
           padding: 10px 16px; border-bottom: 1px solid var(--border);
           background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  .note { color: var(--fg-muted); font-size: 12px; }
  .err { color: var(--status-error); }
  .grow { flex: 1; }

  button { font: inherit; font-size: 12px; border: 1px solid var(--border);
           background: var(--bg-elev); color: var(--fg); border-radius: 7px;
           padding: 5px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: #111; font-weight: 600; }
  button[disabled] { opacity: .45; cursor: not-allowed; }

  input[type=text], textarea, select {
    font: inherit; font-size: 12px; width: 100%; padding: 6px 9px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--fg); }
  textarea { min-height: 70px; resize: vertical; }

  /* ── the filter bar (ws-03 D51) ────────────────────────────────────── */
  .filters { display: flex; flex-direction: column; gap: 6px;
             padding: 9px 16px; border-bottom: 1px solid var(--border);
             background: var(--panel); }
  .filters-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; }
  .chip { font-size: 11px; padding: 3px 10px; border-radius: 12px;
          border: 1px solid var(--border); background: var(--bg-elev);
          color: var(--fg-muted); cursor: pointer; }
  .chip.active { background: var(--accent); color: #111;
                 border-color: var(--accent); font-weight: 600; }
  .dropdown { position: relative; }
  .dd-toggle { font-size: 11px; padding: 3px 10px; border-radius: 12px;
               border: 1px solid var(--border); background: var(--bg-elev);
               color: var(--fg-muted); cursor: pointer; }
  .dd-toggle.active { background: var(--accent); color: #111;
                      border-color: var(--accent); font-weight: 600; }
  .dd-caret { font-size: 9px; opacity: .8; }
  .dd-panel { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
              min-width: 200px; max-height: 280px; overflow-y: auto;
              background: var(--bg-elev); border: 1px solid var(--border);
              border-radius: 8px; padding: 6px;
              box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .dd-option { display: flex; align-items: center; gap: 6px; font-size: 12px;
               color: var(--fg); padding: 4px 6px; border-radius: 4px;
               cursor: pointer; white-space: nowrap; }
  .dd-option:hover { background: var(--bg); }
  .dd-count { margin-left: auto; opacity: .6; }
  .search { max-width: 320px; }

  /* ── the two panes ─────────────────────────────────────────────────── */
  main { display: grid; grid-template-columns: 320px 1fr;
         height: calc(100vh - 96px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr;
                                     height: auto; } }

  #queue { border-right: 1px solid var(--border); overflow-y: auto;
           background: var(--panel); }
  .qrow { display: block; width: 100%; text-align: left; border: none;
          border-bottom: 1px solid var(--border); border-radius: 0;
          background: transparent; padding: 9px 14px; cursor: pointer; }
  .qrow:hover { background: var(--bg-elev); border-color: var(--border); }
  .qrow[aria-current="true"] { background: var(--bg-elev);
    box-shadow: inset 3px 0 0 var(--accent); }
  .qrow .who { font-weight: 600; font-size: 12.5px; }
  .qrow .meta { color: var(--fg-muted); font-size: 11px; margin-top: 2px; }
  .qrow .marks { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
  .qcount { padding: 8px 14px; color: var(--fg-muted); font-size: 11px;
            border-bottom: 1px solid var(--border); }

  .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px;
           border: 1px solid var(--border); color: var(--fg-muted);
           text-transform: uppercase; letter-spacing: .03em; }
  .badge.draft { border-color: var(--accent); color: var(--accent); }
  .badge.doc { border-color: var(--status-ok); color: var(--status-ok); }
  .badge.fault { border-color: var(--status-error); color: var(--status-error); }
  .badge.flag { border-color: var(--status-warn); color: var(--status-warn); }
  .badge.spam { border-color: var(--status-error); color: var(--status-error); }
  .badge.orphan { border-color: var(--status-warn); color: var(--status-warn); }

  #detail { overflow-y: auto; padding: 0 0 40px; }
  .empty { color: var(--fg-muted); padding: 40px 20px; text-align: center; }

  /* ── the fixed strip: input, run, output (ws-03 D52) ───────────────── */
  .who-line { padding: 12px 18px 0; }
  .who-line h2 { font-size: 15px; margin: 0 0 2px; font-weight: 650; }
  .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
           margin: 10px 18px 14px; }
  @media (max-width: 1100px) { .strip { grid-template-columns: 1fr; } }
  .strip > div { background: var(--panel); border: 1px solid var(--border);
                 border-radius: 9px; padding: 10px 12px; }
  .strip h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
              color: var(--fg-muted); margin: 0 0 6px; font-weight: 600; }
  .strip .big { font-size: 15px; font-weight: 650; }
  .strip .sub { font-size: 12px; color: var(--fg-dim); margin-top: 1px; }
  .strip .bar { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── the collapsible sections (ws-03 D53) ──────────────────────────── */
  details.sec { margin: 0 18px 10px; background: var(--panel);
                border: 1px solid var(--border); border-radius: 9px; }
  details.sec > summary { cursor: pointer; padding: 10px 12px; font-size: 11px;
    text-transform: uppercase; letter-spacing: .05em; color: var(--fg-muted);
    font-weight: 600; list-style: none; display: flex; gap: 8px;
    align-items: baseline; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: "▸"; font-size: 9px; }
  details.sec[open] > summary::before { content: "▾"; }
  details.sec > summary .headline { color: var(--fg-dim); text-transform: none;
    letter-spacing: 0; font-weight: 400; }
  details.sec > summary.warn { color: var(--status-warn); }
  details.sec > summary.bad { color: var(--status-error); }
  details.sec > .body { padding: 0 12px 12px; }

  /* ── the seven steps (ws-03 D56) ───────────────────────────────────── */
  .step { display: grid; grid-template-columns: 22px 1fr 68px 190px 28px;
          gap: 8px; align-items: baseline; padding: 5px 0;
          border-top: 1px solid var(--border); font-size: 12px; }
  .step:first-child { border-top: none; }
  .step .n { color: var(--fg-muted); }
  .step .name { font-weight: 600; }
  .step .ms { color: var(--fg-muted); text-align: right; font-variant-numeric: tabular-nums; }
  .step .where { color: var(--fg-muted); font-size: 11px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step.untested .name { color: var(--status-warn); }
  .step.failed .name { color: var(--status-error); }
  .step .said { grid-column: 2 / -1; color: var(--fg-dim); font-size: 11.5px; }
  .step-open { background: none; border: none; color: var(--accent);
               cursor: pointer; padding: 0; font-size: 12px; }
  pre.drawer { white-space: pre-wrap; word-break: break-word; font-size: 11px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 10px; margin: 6px 0 10px; max-height: 420px; overflow: auto; }

  /* ── shared small parts ────────────────────────────────────────────── */
  .card { background: var(--bg); border: 1px solid var(--border);
          border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .fault { display: flex; gap: 8px; margin: 5px 0; font-size: 12px; }
  .fault .kind { color: var(--status-error); min-width: 118px; font-size: 11px; }
  .flag .kind { color: var(--status-warn); }
  .warn { color: var(--status-warn); font-size: 12px; margin-top: 4px; }
  .code { display: inline-block; font-family: ui-monospace, Menlo, Consolas,
          monospace; font-size: 11px; padding: 1px 5px; margin: 1px;
          border: 1px solid var(--border); border-radius: 4px; }
  .code.faulty { border-color: var(--status-error); color: var(--status-error); }
  .turn { border-top: 1px solid var(--border); padding: 7px 0; font-size: 12px; }
  .turn:first-child { border-top: none; }
  .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 3px 10px;
        font-size: 12px; }
  .kv > .k { color: var(--fg-muted); }
</style>
</head>
<body>

<header>
  <h1>Itinerary desk</h1>
  <span class="note" id="summary">loading…</span>
  <span class="grow"></span>
  <span class="note" id="codes-note"></span>
  <button id="new-request">New request</button>
</header>

<div class="filters" id="filters"><span class="note">loading requests…</span></div>

<main>
  <section id="queue"><div class="empty">loading…</div></section>
  <section id="detail"><div class="empty">Choose a request.</div></section>
</main>

<script src="/static/js/briefCard.js?v=20260908"></script>
<script src="/static/js/itineraryDesk.js?v=20260908queue1"></script>
</body>
</html>
